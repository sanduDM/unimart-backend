name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: unimart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/unimart
          DB_USERNAME: root
          DB_PASSWORD: root
          JWT_SECRET: VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdTZWN1cmVTZWNyZXQxMjM0NTY3ODkw
          JWT_ACCESS_MINUTES: 15
          APP_ALLOWED_ORIGINS: http://localhost:5173
          SERVER_PORT: 8080
        run: ./mvnw -B test