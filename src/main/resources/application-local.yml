spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT}

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS}

jwt:
  access-minutes: ${JWT_ACCESS_MINUTES}
